<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>@queniferlung — Account Dashboard</title>
<style>
  :root { --bg:#2d3250; --card:#ffffff; --ink:#2d3250; --ink-page:#ffffff;
          --muted:#676f9d; --muted-card:#5a5f73; --line:#c9c9d1;
          --accent:#f9b17a; --slate:#424769; --lav:#676f9d; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink-page);
         font-family:Helvetica, Arial, sans-serif; font-weight:400; }
  .wrap { max-width:1020px; margin:0 auto; padding:28px 18px 60px; }
  a { color:var(--slate); text-decoration:none; font-weight:400; }
  a:hover { text-decoration:underline; }

  /* White rounded rectangles */
  .panel { background:var(--card); color:var(--ink); border-radius:18px; padding:24px; margin-bottom:28px; }
  .panel h2 { font-size:19px; margin:0 0 4px; font-weight:700; color:var(--ink); }
  .panel .hint { font-size:13px; color:var(--muted-card); margin:0 0 16px; font-weight:400; }

  /* Instagram-style profile header */
  .profile { display:flex; gap:22px; align-items:flex-start; margin-bottom:24px; }
  .avatar { width:88px; height:88px; border-radius:50%; object-fit:cover; flex:0 0 88px; display:block; }
  .profile-info { min-width:0; }
  .profile-name { font-size:20px; font-weight:700; color:var(--ink); display:flex; align-items:center; gap:6px; }
  .profile-name a { color:var(--ink); font-weight:700; }
  .verified { width:18px; height:18px; flex:0 0 18px; }
  .profile-stats { font-size:15px; margin:8px 0; color:var(--ink); }
  .profile-stats b { font-weight:700; }
  .profile-stats span + span { margin-left:18px; }
  .profile-bio { font-size:15px; line-height:1.45; color:#26293a; white-space:pre-line; margin:0; }

  /* Horizontal-scrolling top reels */
  .reel-head { display:flex; align-items:flex-end; justify-content:space-between; gap:12px; }
  .scroll-btns { display:flex; gap:8px; flex:0 0 auto; margin-bottom:16px; }
  .scroll-btns button { width:34px; height:34px; border-radius:50%; border:1px solid var(--line);
                        background:#fff; color:var(--ink); font-size:18px; line-height:1; cursor:pointer; }
  .scroll-btns button:hover { border-color:var(--accent); }
  .reel-scroll { display:flex; gap:12px; overflow-x:auto; scroll-snap-type:x mandatory;
                 padding-bottom:10px; scrollbar-width:thin; scrollbar-color:#c9c9d1 transparent; }
  .reel-scroll::-webkit-scrollbar { height:6px; }
  .reel-scroll::-webkit-scrollbar-thumb { background:#c9c9d1; border-radius:3px; }
  .reel-card { flex:0 0 168px; scroll-snap-align:start; }
  .reel-thumb { position:relative; display:block; border-radius:12px; overflow:hidden; }
  .reel-thumb img { width:168px; height:210px; object-fit:cover; display:block; }
  .reel-thumb .rank { position:absolute; top:8px; left:8px; background:rgba(45,50,80,.85); color:#fff;
                      font-size:12px; font-weight:700; padding:3px 8px; border-radius:20px; }
  .reel-thumb .overlay { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center;
                         justify-content:center; gap:4px; background:rgba(45,50,80,.72); color:#fff;
                         font-size:14px; opacity:0; transition:opacity .15s ease; text-align:center; }
  .reel-thumb .overlay b { font-weight:700; font-size:16px; font-variant-numeric:tabular-nums; }
  .reel-thumb:hover .overlay, .reel-thumb:focus-within .overlay, .reel-thumb:active .overlay { opacity:1; }
  .reel-cap { font-size:13px; line-height:1.35; color:var(--ink); margin-top:8px; white-space:nowrap;
              overflow:hidden; text-overflow:ellipsis; }
  .reel-date { font-size:12px; color:var(--muted-card); margin-top:2px; }

  /* Graph tabs — four squares */
  .tabs { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-bottom:18px; }
  .tab { background:#e4e4e9; border:1px solid #e4e4e9; border-radius:12px; padding:14px 10px;
         font-family:Helvetica, Arial, sans-serif; font-size:15px; font-weight:700; color:var(--ink);
         cursor:pointer; text-align:center; line-height:1.3; }
  .tab:hover { border-color:var(--accent); }
  .tab.active { background:var(--accent); border-color:var(--accent); }
  svg.chart { width:100%; height:auto; display:block; }

  footer { font-size:14px; color:#c6c9d8; text-align:center; font-weight:400; }
  @media (max-width:640px){
    .panel { padding:18px; }
    .profile { gap:14px; }
    .avatar { width:64px; height:64px; flex-basis:64px; }
    .profile-name { font-size:18px; }
    .profile-stats { font-size:14px; }
    .profile-bio { font-size:14px; }
    .tabs { grid-template-columns:repeat(2,1fr); }
    .reel-card { flex-basis:140px; }
    .reel-thumb img { width:140px; height:175px; }
  }
</style>
</head>
<body>
<div class="wrap">

  <section class="panel">
    <div class="profile">
      <img class="avatar" id="avatar" src="" alt="Queniferlung profile picture">
      <div class="profile-info">
        <div class="profile-name"><a href="https://www.instagram.com/queniferlung/" target="_blank" rel="noopener">@queniferlung</a><span id="verified"></span></div>
        <div class="profile-stats"><span><b id="posts">—</b> posts</span><span><b id="followers">—</b> followers</span></div>
        <p class="profile-bio" id="bio"></p>
      </div>
    </div>

    <div class="reel-head">
      <div>
        <h2>Top 10 Performing Videos</h2>
        <p class="hint">By lifetime Views. Hover a video for Views and Likes — tap to open the reel in a new tab.</p>
      </div>
      <div class="scroll-btns">
        <button id="scroll-left" aria-label="Scroll left">&#8249;</button>
        <button id="scroll-right" aria-label="Scroll right">&#8250;</button>
      </div>
    </div>
    <div class="reel-scroll" id="reel-scroll"></div>
  </section>

  <section class="panel">
    <div class="tabs" id="tabs">
      <button class="tab active" data-tab="lifetime">Lifetime views</button>
      <button class="tab" data-tab="followers">Followers Growth</button>
      <button class="tab" data-tab="last30">Views in the last 30 days</button>
      <button class="tab" data-tab="monthly">Monthly Average Views</button>
    </div>
    <h2 id="chart-title">Lifetime views</h2>
    <p class="hint" id="chart-hint"></p>
    <div id="chart"></div>
  </section>

  <footer id="updated">Source: Instagram account insights for @queniferlung</footer>
</div>

<script>
const fmt = n => n == null ? "—" : n.toLocaleString("en-US");
const GRID = "#c9c9d1", AXIS = "#5a5f73";
const CHECK = '<svg class="verified" viewBox="0 0 24 24" aria-label="Verified"><circle cx="12" cy="12" r="11" fill="#0095f6"/><path d="M7.5 12.5l3 3 6-7" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';

// Hand-rolled SVG line chart (line graphs only, same as before).
function lineChart(el, dates, values, color, lab) {
  const label = lab || (d => d.slice(5));
  const W=920, H=260, P={l:64,r:14,t:14,b:28};
  let min = Math.min(...values), max = Math.max(...values);
  const pad = (max-min)*0.03 || 1; min-=pad; max+=pad;
  const n = values.length;
  const x = i => P.l + (W-P.l-P.r)*i/Math.max(n-1,1);
  const y = v => P.t + (H-P.t-P.b)*(1-(v-min)/(max-min));
  const grid = [0.25,0.5,0.75].map(f=>{
    const v = min+(max-min)*f;
    return `<line x1="${P.l}" y1="${y(v)}" x2="${W-P.r}" y2="${y(v)}" stroke="${GRID}" stroke-width="1"/>
      <text x="${P.l-8}" y="${y(v)+4}" text-anchor="end" font-size="12" fill="${AXIS}">${fmt(Math.round(v))}</text>`;
  }).join("");
  const step = Math.ceil(n/12);
  const labels = dates.map((d,i)=> i%step===0 || i===n-1 ?
    `<text x="${x(i)}" y="${H-8}" text-anchor="middle" font-size="12" fill="${AXIS}">${label(d)}</text>` : "").join("");
  const pts = values.map((v,i)=>`${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(" ");
  const dots = values.map((v,i)=> i%Math.ceil(n/30)===0 || i===n-1 ?
    `<circle cx="${x(i)}" cy="${y(v)}" r="3.5" fill="${color}"><title>${dates[i]}: ${fmt(v)}</title></circle>` : "").join("");
  el.innerHTML = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img"><polyline points="${pts}" fill="none" stroke="${color}" stroke-width="3" stroke-linejoin="round"/>${grid}${dots}${labels}</svg>`;
}

let DATA = null;
let ACTIVE = "lifetime";

function showTab(key) {
  ACTIVE = key;
  const d = DATA;
  document.querySelectorAll("#tabs .tab").forEach(b => b.classList.toggle("active", b.dataset.tab === key));
  const el = document.getElementById("chart");
  const title = document.getElementById("chart-title");
  const hint = document.getElementById("chart-hint");
  if (key === "lifetime") {
    const pts = d.lifetimeCumulative;
    const dates = pts.map(p=>p.date), vals = pts.map(p=>p.value);
    title.textContent = "Lifetime views";
    hint.textContent = `Cumulative Views, ${dates[0]} – ${dates[dates.length-1]} · ${fmt(vals[vals.length-1])} total since Jul 15 (daily data from Aug 27; Jul 15 – Aug 26 included in the starting total)`;
    lineChart(el, dates, vals, "#f9b17a");
  } else if (key === "followers") {
    const pts = d.followersDaily;
    const dates = pts.map(p=>p.date), vals = pts.map(p=>p.followers);
    title.textContent = "Followers Growth";
    hint.textContent = `Total Followers, ${dates[0]} – ${dates[dates.length-1]} (${fmt(vals[0])} → ${fmt(vals[vals.length-1])})`;
    lineChart(el, dates, vals, "#424769");
  } else if (key === "last30") {
    const pts = d.daily.views.slice(-30);
    const dates = pts.map(p=>p.date), vals = pts.map(p=>p.value);
    title.textContent = "Views in the last 30 days";
    hint.textContent = `Daily Views, ${dates[0]} – ${dates[dates.length-1]} (${fmt(vals.reduce((a,b)=>a+b,0))} total)`;
    lineChart(el, dates, vals, "#f9b17a");
  } else if (key === "monthly") {
    const pts = d.monthlyAvgViews;
    const dates = pts.map(p=>p.month), vals = pts.map(p=>p.avgViews);
    title.textContent = "Monthly Average Views";
    hint.textContent = "Average lifetime Views per reel posted that month, as of " + d.windowTotals.end +
      " (" + pts.map(p=>`${p.month}: ${p.reels} reels`).join(" · ") + ")";
    lineChart(el, dates, vals, "#676f9d", m=>m);
  }
}

fetch("data.json").then(r=>r.json()).then(d=>{
  DATA = d;
  document.getElementById("updated").textContent =
    "Source: Instagram account insights for @queniferlung · Data as of " +
    new Date(d.generatedAt).toLocaleString("en-US",{month:"short",day:"numeric",year:"numeric"}) +
    " · refreshed every morning";

  // Profile header, Instagram-style.
  const p = d.profile || {};
  if (p.profilePic) document.getElementById("avatar").src = p.profilePic;
  if (p.verified) document.getElementById("verified").innerHTML = CHECK;
  document.getElementById("posts").textContent = fmt(p.posts);
  document.getElementById("followers").textContent = fmt(d.latest.followers);
  document.getElementById("bio").textContent = d.bio || "";

  // Top 10 horizontal scroll.
  const card = r => {
    const thumb = r.thumbnail
      ? `<img src="${r.thumbnail}" alt="" loading="lazy">`
      : `<div style="width:168px;height:210px;background:#e4e4e9"></div>`;
    return `<div class="reel-card">
      <a class="reel-thumb" href="${r.url}" target="_blank" rel="noopener">${thumb}
        <span class="rank">#${r.rank}</span>
        <span class="overlay"><span><b>${fmt(r.views)}</b> Views</span><span><b>${fmt(r.likes)}</b> Likes</span></span>
      </a>
      <div class="reel-cap">${r.caption}</div>
      <div class="reel-date">${r.date || ""}</div>
    </div>`;
  };
  document.getElementById("reel-scroll").innerHTML = d.topReels.map(card).join("");
  const scroller = document.getElementById("reel-scroll");
  document.getElementById("scroll-left").addEventListener("click", ()=>scroller.scrollBy({left:-560, behavior:"smooth"}));
  document.getElementById("scroll-right").addEventListener("click", ()=>scroller.scrollBy({left:560, behavior:"smooth"}));

  // Graph tabs.
  document.querySelectorAll("#tabs .tab").forEach(b =>
    b.addEventListener("click", ()=>showTab(b.dataset.tab)));
  showTab("lifetime");
}).catch(()=>{ document.getElementById("updated").textContent = "Could not load data.json"; });
</script>
</body>
</html>
